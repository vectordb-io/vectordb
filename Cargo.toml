[workspace]
members = ["crates/engine", "crates/server", "crates/python"]
default-members = ["crates/engine", "crates/server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
repository = "https://github.com/vectordb-io/vectordb"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1
