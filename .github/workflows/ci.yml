name: Rust checks
on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', 'pyproject.toml', 'Dockerfile', '.dockerignore', 'crates/**', 'python/**', 'tests/**', 'scripts/**', 'examples/**', 'docs/**', 'README*', 'website/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy && rustup default stable
      - name: Format
        run: cargo fmt --all --check
      - name: Test
        run: cargo test --workspace --locked
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build --workspace --locked
      - name: Process recovery and examples
        run: python3 scripts/smoke.py
      - name: Website structure and links
        run: python3 scripts/check_website.py
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Test minimum supported Rust version
        run: |
          rustup toolchain install 1.89 --profile minimal
          cargo +1.89 test --workspace --locked
  python:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.9', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir dist
      - name: Install wheel into a clean environment
        run: |
          python -m venv .venv-wheel
          .venv-wheel/bin/python -m pip install --no-index --only-binary=:all: --find-links dist vectordb_io
      - name: Test installed package
        run: |
          .venv-wheel/bin/python -m unittest discover -s tests/python -v
          .venv-wheel/bin/python examples/embedded.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build release image
        run: docker build -t vectordb:local .
      - name: Container startup and crash recovery
        run: python3 scripts/container_smoke.py
