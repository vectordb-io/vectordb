[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "vectordb-embedded"
dynamic = ["version"]
description = "Embedded VectorDB: a transactional Rust vector database for Python"
readme = "docs/python.md"
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
python-source = "python"
module-name = "vectordb._native"
features = ["extension-module"]
locked = true
