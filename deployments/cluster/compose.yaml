# Isolated development dependencies. Not a production HA configuration.
services:
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.21
    command: [etcd, --name=dev, --data-dir=/etcd-data, --listen-client-urls=http://0.0.0.0:2379, --advertise-client-urls=http://etcd:2379]
    ports: ["127.0.0.1:12379:2379"]
    volumes: ["etcd-data:/etcd-data"]
  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:19092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,INTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://127.0.0.1:19092,INTERNAL://kafka:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: -1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: ["kafka-data:/var/lib/kafka/data"]
  minio:
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: [server, /data]
    ports: ["127.0.0.1:19000:9000"]
    environment:
      MINIO_ROOT_USER: development
      MINIO_ROOT_PASSWORD: development-only-password
    volumes: ["minio-data:/data"]
volumes:
  etcd-data:
  kafka-data:
  minio-data:
